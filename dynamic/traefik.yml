tls:
  certificates:
    - certFile: /etc/traefik/dynamic/server.crt
      keyFile: /etc/traefik/dynamic/server.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/dynamic/server.crt
        keyFile: /etc/traefik/dynamic/server.key

http:
  routers:
    redirect-to-https:
      entryPoints:
        - web
      rule: PathPrefix()
      middlewares:
        - redirect-https
      service: noop
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
  services:
    noop:
      loadBalancer:
        servers:
          - url: http://127.0.0.1
