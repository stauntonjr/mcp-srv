services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    network_mode: host
    command:
      - --providers.docker=false
      - --providers.file.filename=/etc/traefik/dynamic/traefik.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/dynamic/traefik.yml:ro
      - /root/dotfiles/ssl:/certs:ro
    restart: unless-stopped

  mcp:
    build:
      # Expand build context to parent so we can copy the local mcp-filesystem-sshfs
      # directory into the image during build. The Dockerfile lives in mcp-srv/.
      context: ..
      dockerfile: mcp-srv/Dockerfile
    container_name: 1mcp
    network_mode: host
    env_file:
      - ./.env
    environment:
      - ONE_MCP_HOST=0.0.0.0
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
      - FS_PROXMOX_HOST=10.0.0.250
      - FS_PROXMOX_USER=root
      - FS_PROXMOX_KEY_PATH=/ssh/id_ed25519
      - FS_PROXMOX_ALLOWED_DIRS=/root/
      - FS_DNS_HOST=10.0.0.152
      - FS_DNS_USER=root
      - FS_DNS_KEY_PATH=/ssh/id_ed25519
      - FS_DNS_ALLOWED_DIRS=/root/
      - FS_VPN_HOST=10.0.0.7
      - FS_VPN_USER=root
      - FS_VPN_KEY_PATH=/ssh/id_ed25519
      - FS_VPN_ALLOWED_DIRS=/root/
      - FS_OIDC_HOST=10.0.0.226
      - FS_OIDC_USER=root
      - FS_OIDC_KEY_PATH=/ssh/id_ed25519
      - FS_OIDC_ALLOWED_DIRS=/root/
      - FS_EDIACARIAN_HOST=193.122.204.110
      - FS_EDIACARIAN_USER=ubuntu
      - FS_EDIACARIAN_KEY_PATH=/ssh/id_ed25519
      - FS_EDIACARIAN_ALLOWED_DIRS=/home/ubuntu/
      - FS_MCP_HOST=mcp.ediacarian.home
      - FS_MCP_USER=root
      - FS_MCP_KEY_PATH=/ssh/id_ed25519
      - FS_MCP_ALLOWED_DIRS=/root/
      - PLAYWRIGHT_BROWSERS_PATH=/usr/bin
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - ./config:/config
      - ./memory:/stores
      - /root/dotfiles/ssh:/ssh:ro
    command: ["node", "index.js", "--config-dir", "/config", "--host", "0.0.0.0", "--port", "3050", "--transport", "http", "--external-url", "https://mcp.ediacarian.home", "--trust-proxy", "172.18.0.0/16"]
    labels:
      - "traefik.enable=true"
    restart: unless-stopped

