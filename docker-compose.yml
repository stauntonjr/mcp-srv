services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    network_mode: host
    command:
      - --providers.docker=false
      - --providers.file.filename=/etc/traefik/dynamic/traefik.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/dynamic/traefik.yml:ro
      - /root/dotfiles/ssl:/certs:ro
    restart: unless-stopped
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 1mcp
    network_mode: host
    env_file:
      - ./.env
    environment:
      - ONE_MCP_HOST=0.0.0.0
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
      - PLAYWRIGHT_BROWSERS_PATH=/usr/bin
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - SQLITE_DB_PATH=/var/mcp/sqlite/mcp.db
    volumes:
      - ./config:/config
      - ./memory:/stores
      - /root/dotfiles/ssh:/ssh:ro
      - /root/dotfiles/ssl:/certs:ro
      - ./data/sqlite:/var/mcp/sqlite:rw
    command: ["node", "index.js", "--config-dir", "/config", "--host", "0.0.0.0", "--port", "3050", "--transport", "http", "--external-url", "https://mcp.ediacarian.home", "--trust-proxy", "172.18.0.0/16", "--enable-async-loading"]
    labels:
      - "traefik.enable=true"
    restart: unless-stopped

