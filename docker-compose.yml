services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/dynamic/traefik.yml
      - --api.dashboard=false
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/dynamic/traefik.yml:ro
      - /root/dotfiles/ssl:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  mcp:
    image: ghcr.io/1mcp-app/agent:latest
    container_name: 1mcp
    env_file:
      - ./.env
    environment:
      - ONE_MCP_HOST=0.0.0.0
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
    volumes:
      - ./config:/config
      - ./memory:/stores
    command: ["node", "index.js", "--config-dir", "/config", "--host", "0.0.0.0", "--port", "3050", "--transport", "http", "--external-url", "https://mcp.ediacarian.home", "--trust-proxy", "172.18.0.0/16"]
    labels:
      - "traefik.enable=true"
    restart: unless-stopped
